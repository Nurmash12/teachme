<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Удаление карточки — Teach Me</title>
</head>
<body>
    <main>
        <h1>Удалить карточку?</h1>
        <p>Вопрос: <strong>{{ card.question }}</strong></p>
        <p>Это действие нельзя отменить.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Иә, өшіру / Да, удалить</button>
        </form>
        <a href="{% url 'source_detail' source.pk %}">Бас тарту / Отмена</a>
    </main>
</body>
</html>
